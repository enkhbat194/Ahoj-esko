              '<button type="button" id="a0OutlineBack" style="padding:9px 13px;border-radius:12px;background:#2a2a2e;color:#fff;border:1px solid rgba(255,255,255,.16);font:inherit">‹ Бүх сэдэв</button>' +
              '<div style="margin:22px 2px 14px">' +
                '<p style="color:#d8b56a;font-size:11px;letter-spacing:1.2px">A0 • ' + escapeHtml(ch.id) + ' • ХӨТӨЛБӨРИЙН ЗУРАГЛАЛ</p>' +
                '<h2 style="margin:10px 0 5px;font-size:24px;line-height:1.2">' + escapeHtml(ch.title) + '</h2>' +
                '<p style="font-size:14px;color:#aaa">' + escapeHtml(ch.subtitle) + '</p>' +
                '<p style="font-size:13px;margin:15px 0;color:#ccc">' + ch.lessons.length + ' жижиг хичээл төлөвлөсөн. ' + (ch.chapter===1?'Эхний 3 жишиг хичээлийг шинэчилж байна. Үлдсэн 15 нь өмнөх ноорог, эцсийн хөтөлбөр биш. Бодит аудио ба дуудлагын баталгаа хүлээгдэж байна.':'Аудио, дасгал, ярианы шалгалт хараахан нийтлэгдээгүй.') + '</p>' +
              '</div>' +
              '<ol style="padding:0;margin:0">' + lessonRows + '</ol>' +
              '<p style="padding:16px;border-radius:12px;background:#242428;font-size:13px;line-height:1.55;color:#ddd;margin-top:16px"><b>Эцсийн зорилго:</b> ' + escapeHtml(ch.finalTask) + '</p>' +
            '</section>';
          mainArea.querySelector("#a0OutlineBack").addEventListener("click", renderStagesView);
        }

        const slidesHtml = STAGE_CHAPTERS.map((ch, idx) => {
          const isDone = ch.done >= ch.total;
          const isNew = ch.done === 0;
          const pct = Math.round((ch.done / ch.total) * 100);
          const isCream = ch.accent === "#E8DCC8";
          const statusTag = ch.isOutline
            ? `<span class="mini-tag status">ТӨЛӨВЛӨСӨН</span>`
            : isNew
              ? `<span class="mini-tag status">ШИНЭ</span>`
            : isDone
              ? `<span class="mini-tag status">ДУУССАН</span>`
              : "";

          return `
            <article class="chapter-slide" data-index="${idx}">
              <div class="chapter-card">
                <div class="chapter-hero" role="img" aria-label="${escapeHtml(ch.title)} — ${escapeHtml(ch.word)}">
                  <div class="chapter-glow" style="background: radial-gradient(230px 145px at 50% 38%, ${ch.accent}3D 0%, transparent 72%);"></div>
                  <div class="chapter-top-line"></div>
                  <div class="emblem-area">
                    <div class="emblem-frame glass-tile">${getStageSvg(ch.icon, ch.accent)}</div>
                  </div>
                  <div class="chapter-hero-caption">
                    <span class="cefr-hero-pill glass-pill">ČEŠTINA • A0</span>
                    <div class="chapter-cz-word">${escapeHtml(ch.word)}</div>
                  </div>
                </div>

                <div class="chapter-body">
                  <div>
                    <div class="chapter-tags">
                      <span class="mini-tag">A0</span>
                      <span class="mini-tag">CHAPTER ${ch.chapter} &gt;</span>
                      ${statusTag}
                    </div>
                    <h2 class="chapter-title">${escapeHtml(ch.title)}</h2>
                    <p class="chapter-subtitle">${escapeHtml(ch.subtitle)}</p>
                  </div>

                  <div>
                    <div class="chapter-progress-row">
                      <span>${ch.total} хичээлийн зураглал</span>
                      <span class="chapter-pct" style="background:${ch.accent}26;color:${ch.accent}">${pct}%</span>
                    </div>
                    <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
                      <div class="progress-fill" style="width:${pct}%;background:${ch.accent}"></div>
                    </div>
                  </div>

                  <button
                    type="button"
                    class="chapter-cta"
                    data-chapter-start="${ch.chapter}"
                    style="background:${ch.accent};color:${isCream ? "#141414" : "#FFFFFF"}"
                  >
                    ${ch.isOutline ? "Хичээлүүдийг харах" : isDone ? "↻ Дахин үе давах" : "Үе давах"}
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        const dotsHtml = STAGE_CHAPTERS.map((ch, idx) =>
          `<button type="button" class="dot-btn" data-dot="${idx}" aria-label="CHAPTER ${ch.chapter} - ${escapeHtml(ch.title)}"></button>`
        ).join("");

        mainArea.innerHTML = `
          <div class="stages-container">
            <p style="margin:0 16px 12px;color:#b8a592;font-size:12px;line-height:1.4">A0 · ${STAGE_CHAPTERS.length} сэдэв · ${STAGE_CHAPTERS.reduce((n, ch) => n + ch.total, 0)} жижиг хичээлийн зураглал</p>
            <button type="button" id="alphabetBtn" class="alphabet-banner glass-surface">
              <span class="alphabet-row">
                <span class="alphabet-tile glass-tile" aria-hidden="true"><span style="position:relative;z-index:2">Aa</span></span>
                <span class="alphabet-copy">
                  <span class="alphabet-title">Цагаан толгой сурах</span>
                  <span class="alphabet-sub">Шинэ хэлний үсэг, дуудлагыг эхнээс нь</span>
                </span>
                <span class="alphabet-chevron" aria-hidden="true">›</span>
              </span>
            </button>

            <div class="carousel-shell">
              <div id="carouselTrack" class="carousel-track no-scrollbar" aria-label="Бүлгүүд">${slidesHtml}</div>
              <button type="button" id="prevChapterBtn" class="carousel-arrow prev glass-pill" aria-label="Өмнөх бүлэг">‹</button>
              <button type="button" id="nextChapterBtn" class="carousel-arrow next glass-pill" aria-label="Дараагийн бүлэг">›</button>
            </div>

            <div class="carousel-footer">
              <div id="dotsContainer" class="dots-row" role="tablist" aria-label="Бүлэг сонгох">${dotsHtml}</div>
              <p id="chapterCounter" class="chapter-counter"></p>
            </div>
          </div>
        `;

        const track = document.getElementById("carouselTrack");
        const prevBtn = document.getElementById("prevChapterBtn");
        const nextBtn = document.getElementById("nextChapterBtn");
        const counterEl = document.getElementById("chapterCounter");

        function syncCarouselUI() {
          const current = STAGE_CHAPTERS[state.activeStageIdx];
          document.querySelectorAll("#dotsContainer .dot-btn").forEach((dot, idx) => {
            const active = idx === state.activeStageIdx;
            dot.style.width = active ? "28px" : "7px";
            dot.style.height = active ? "8px" : "7px";
            dot.style.backgroundColor = active ? current.accent : "#3A3A3E";
            if (active) dot.setAttribute("aria-current", "true");
            else dot.removeAttribute("aria-current");
          });
          prevBtn.disabled = state.activeStageIdx === 0;
          nextBtn.disabled = state.activeStageIdx === STAGE_CHAPTERS.length - 1;
          counterEl.textContent = `СЭДЭВ ${current.chapter + 1} / ${STAGE_CHAPTERS.length} • ${current.title}`;
        }

        function goToStage(index, smooth = true) {
          const clamped = Math.max(0, Math.min(STAGE_CHAPTERS.length - 1, index));
          state.activeStageIdx = clamped;
          track.scrollTo({ left: clamped * track.clientWidth, behavior: smooth ? "smooth" : "auto" });
          syncCarouselUI();
        }

        document.getElementById("alphabetBtn").addEventListener("click", () => {
          window.location.assign("./alphabet-a0.html");
        });
        prevBtn.addEventListener("click", () => goToStage(state.activeStageIdx - 1));
        nextBtn.addEventListener("click", () => goToStage(state.activeStageIdx + 1));

        track.addEventListener("scroll", () => {
          if (!track.clientWidth) return;
          const idx = Math.round(track.scrollLeft / track.clientWidth);
          if (idx !== state.activeStageIdx && idx >= 0 && idx < STAGE_CHAPTERS.length) {
            state.activeStageIdx = idx;
            syncCarouselUI();
          }
        }, { passive: true });

        track.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-chapter-start]");
          if (!btn) return;
          const ch = STAGE_CHAPTERS[Number(btn.dataset.chapterStart)];
          if (ch && ch.chapter === 0) { window.location.assign("./alphabet-a0.html"); return; }
          if (ch) showTopicOutline(ch);
        });

        document.getElementById("dotsContainer").addEventListener("click", (e) => {
          const dot = e.target.closest("[data-dot]");
          if (dot) goToStage(Number(dot.dataset.dot));
        });

        goToStage(state.activeStageIdx, false);
        window.__goToStage = goToStage;
        window.__syncTrackResize = () => goToStage(state.activeStageIdx, false);
      }

      /* =========================================================
         6. TAB 2 — УНШИХ (НОМЫН САН)
         ========================================================= */
      function renderReadingView(preserveFocus = false) {
        window.__goToStage = null;
        window.__syncTrackResize = null;

        const prevScrollTop = document.getElementById("readingScroll")?.scrollTop || 0;
        const books = getFilteredBooks();
        const activeBook = BOOKS.find((b) => b.id === state.activeReadingBookId) || null;
        const filtersOn = hasActiveFilters();

        const chips = [];
        if (state.filters.quick.popular) chips.push("Эрэлттэй");
        if (state.filters.quick.saved) chips.push("Хадгалсан");
        if (state.filters.quick.finished) chips.push("Уншиж дуусгасан");
        if (state.filters.level) chips.push(`Түвшин: ${state.filters.level}`);
        if (state.filters.lpsRange !== "all") chips.push("LPS 9 · 25");
        if (state.filters.topic !== "Бүгд") chips.push(state.filters.topic);
        if (state.filters.category !== "Бүгд") chips.push(state.filters.category);
        if (state.filters.agePriority) chips.push(`Нас: ${state.filters.agePriority}`);

        const chipsHtml = chips.length
          ? `<div class="active-filters-strip no-scrollbar">${chips.map((c) => `<span class="active-chip">${escapeHtml(c)}</span>`).join("")}</div>`
          : "";

        const booksHtml = books.length
          ? `<div class="books-grid">
              ${books.map((book) => {
                const pct = getBookProgress(book);
                const isReading = book.id === state.activeReadingBookId;
                const isDone = pct >= 100;
                return `
                  <article class="book-card ${isReading ? "is-reading" : ""}" data-open-detail="${book.id}" role="button" tabindex="0" aria-label="${escapeHtml(book.title)} дэлгэрэнгүй">
                    <div class="book-cover" style="background: ${book.gradient};">
                      <div class="book-cover-deco" aria-hidden="true">
                        <svg width="100%" height="100%" viewBox="0 0 180 220" preserveAspectRatio="none">
                          <circle cx="150" cy="40" r="64" fill="${book.accent}" fill-opacity="0.24"/>
                          <circle cx="24" cy="186" r="56" fill="#000000" fill-opacity="0.24"/>
                          <rect x="14" y="14" width="152" height="192" rx="14" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
                        </svg>
                      </div>

                      <div class="book-cover-top">
                        <div class="book-badges">
                          <span class="badge-cefr">${escapeHtml(book.level)}</span>
                          <span class="badge-lps">LPS ${book.lps}</span>
                        </div>
                        <button
                          type="button"
                          class="bookmark-btn ${book.saved ? "is-saved" : ""}"
                          data-toggle-save="${book.id}"
                          aria-label="${book.saved ? "Хадгалснаас хасах" : "Хадгалах"}"
                        >
                          ${book.saved ? UI_ICONS.heartSolid : UI_ICONS.heartOutline}
                        </button>
                      </div>

                      <div class="cover-center-title">
                        <div class="cover-main-text">${escapeHtml(book.title)}</div>
                        <span class="cover-cat-tag">${escapeHtml(book.category)}</span>
                      </div>

                      <div class="book-cover-bottom">
                        <span class="age-pill">Нас: ${escapeHtml(book.age)}</span>
                        ${isDone ? `<span class="done-pill">✓ 100%</span>` : ""}
                      </div>
                    </div>

                    ${pct > 0 ? `<div class="book-progress-strip"><div class="book-progress-strip-fill" style="width:${pct}%"></div></div>` : ""}

                    <div class="book-info">
                      <h3 class="book-title">${escapeHtml(book.title)}</h3>
                      <p class="book-mn-sub">${escapeHtml(book.mnSubtitle)}</p>
                      <div class="book-meta">
                        ${getTopicIcon(book.topic)}
                        <span>${escapeHtml(book.topic)} · ${book.chapters.length} бүлэг</span>
                      </div>
                    </div>
                  </article>
                `;
              }).join("")}
            </div>`
          : `<div class="empty-state glass-surface">
              <p class="empty-title">Тохирох зохиол олдсонгүй</p>
              <p class="empty-sub">Хайлтын үг эсвэл шүүлтүүрээ өөрчлөөд дахин оролдоно уу.</p>
              <button type="button" id="emptyResetBtn" class="empty-reset-btn">Шүүлтүүр цэвэрлэх</button>
            </div>`;

        // Хөвдөг "ОДОО УНШИЖ БАЙНА" самбар — ЗӨВХӨН номын бүлэг уншсаны дараа л харагдана!
        const activePct = activeBook ? Math.max(11, getBookProgress(activeBook)) : 0;
        const floatingBarHtml = activeBook
          ? `
            <div class="floating-reading-bar" id="floatingReadingBar" role="region" aria-label="Одоо уншиж байна">
              <div class="mini-thumb" style="background: ${activeBook.gradient};">
                <span class="mini-thumb-text">${escapeHtml(activeBook.title)}</span>
              </div>
              <div class="floating-center">
                <div class="floating-label">
                  ${UI_ICONS.book}
                  <span>ОДОО УНШИЖ БАЙНА</span>
                </div>
                <div class="floating-book-title">${escapeHtml(activeBook.title)}</div>
                <div class="floating-progress-wrap">
                  <div class="floating-progress-track">
                    <div class="floating-progress-fill" style="width:${activePct}%"></div>
                  </div>
                  <span class="floating-pct">${activePct}%</span>
                </div>
              </div>
              <button type="button" id="floatingPlayBtn" class="floating-play-btn" aria-label="Үргэлжлүүлэн унших">
                ${UI_ICONS.play}
              </button>
            </div>
          `
          : "";

        mainArea.innerHTML = `
          <div id="readingScroll" class="reading-scroll no-scrollbar ${activeBook ? "has-floating-bar" : ""}">
            <div class="search-row">
              <div class="search-box">
                ${UI_ICONS.search}
                <input
                  type="text"
                  id="bookSearchInput"
                  class="search-input"
                  placeholder="Ном, зохиол хайх..."
                  value="${escapeHtml(state.searchQuery)}"
                  autocomplete="off"
                />
                ${state.searchQuery ? `<button type="button" id="clearSearchBtn" class="search-clear-btn" aria-label="Хайлт цэвэрлэх">✕</button>` : ""}
              </div>

              <button type="button" id="openFilterBtn" class="filter-trigger-btn" aria-label="Шүүх">
                ${UI_ICONS.sliders}
                ${filtersOn ? `<span class="filter-badge-dot" aria-hidden="true"></span>` : ""}
              </button>
            </div>

            <div class="library-header">
              <div>
                <h1 class="library-title">Бүх зохиолууд</h1>
                <p class="library-sub">Бүх зохиолоос хайх, шүүх</p>
              </div>
              <span class="count-pill">${books.length} ном</span>
            </div>

            ${chipsHtml}
            ${booksHtml}
          </div>

          ${floatingBarHtml}
        `;

        const scrollEl = document.getElementById("readingScroll");
        scrollEl.scrollTop = prevScrollTop;

        const searchInput = document.getElementById("bookSearchInput");
        searchInput.addEventListener("input", (e) => {
          state.searchQuery = e.target.value;
          renderReadingView(true);
        });
        if (preserveFocus) {
          searchInput.focus();
          const len = searchInput.value.length;
          searchInput.setSelectionRange(len, len);
        }

        const clearSearchBtn = document.getElementById("clearSearchBtn");
        if (clearSearchBtn) {
          clearSearchBtn.addEventListener("click", () => {
            state.searchQuery = "";
            renderReadingView(true);
          });
        }

        document.getElementById("openFilterBtn").addEventListener("click", openFilterSheet);

        const emptyResetBtn = document.getElementById("emptyResetBtn");
        if (emptyResetBtn) {
          emptyResetBtn.addEventListener("click", () => {
            resetAllFilters();
            renderReadingView();
          });
        }

        scrollEl.addEventListener("click", (e) => {
          const saveBtn = e.target.closest("[data-toggle-save]");
          if (saveBtn) {
            e.stopPropagation();
            const book = BOOKS.find((b) => b.id === saveBtn.dataset.toggleSave);
            if (book) {
              book.saved = !book.saved;
              showToast(book.saved ? `«${book.title}» хадгалагдлаа` : `«${book.title}» хадгалснаас хасагдлаа`);
              renderReadingView();
            }
            return;
          }

          const card = e.target.closest("[data-open-detail]");
          if (card) openBookDetail(card.dataset.openDetail);
        });

        scrollEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            const card = e.target.closest("[data-open-detail]");
            if (card && !e.target.closest("button")) {
              e.preventDefault();
              openBookDetail(card.dataset.openDetail);
            }
          }
        });

        const floatingBar = document.getElementById("floatingReadingBar");
        if (floatingBar && activeBook) {
          floatingBar.addEventListener("click", (e) => {
            if (e.target.closest("#floatingPlayBtn")) {
              openChapterReader(activeBook.id, getNextUnreadChapter(activeBook));
            } else {
              openBookDetail(activeBook.id);
            }
          });
        }
      }

      /* =========================================================
         7. НОМЫН ДЭЛГЭРЭНГҮЙ ДЭЛГЭЦ (BOOK DETAIL SCREEN)
         ========================================================= */
      function openBookDetail(bookId) {
        state.detailBookId = bookId;
        renderBookDetail();
        bookDetailScreen.hidden = false;
      }

      function closeBookDetail() {
        bookDetailScreen.hidden = true;
        state.detailBookId = null;
        if (state.activeTab === "read") renderReadingView();
      }

      function renderBookDetail() {
        const book = BOOKS.find((b) => b.id === state.detailBookId);
        if (!book) return;

        const prevScroll = document.getElementById("detailScroll")?.scrollTop || 0;
        const doneCount = book.completedChapters.length;
        const draftCount = countSavedDrafts(book);

        // 9 бүлэг + 3 бүлэг тутамд 1 шалгалтын карт үүсгэх
        let listHtml = "";
        book.chapters.forEach((ch) => {
          const isDone = book.completedChapters.includes(ch.num);
          listHtml += `
            <button type="button" class="chapter-row" data-read-chapter="${ch.num}">
              <span class="chapter-num-circle">${ch.num}</span>
              <span class="chapter-row-text">
                <span class="chapter-row-title" style="display:block">Бүлэг ${ch.num}: ${escapeHtml(ch.title)}</span>
                <span class="chapter-row-sub" style="display:block">${ch.newWords} шинэ үг${isDone ? " сурсан" : ""}</span>
              </span>
              ${isDone ? `<span class="chapter-done-check" aria-label="Дууссан">${UI_ICONS.check}</span>` : ""}
            </button>
          `;

          // 3, 6, 9-р бүлгийн ард Шалгалт 1, 2, 3 карт нэмнэ
          if (ch.num % 3 === 0) {
            const quizNum = ch.num / 3;
            const rangeStart = ch.num - 2;
            const unlocked = book.completedChapters.includes(ch.num);
            const bestScore = book.quizScores[quizNum];

            if (unlocked) {
              listHtml += `
                <button type="button" class="quiz-row is-unlocked" data-open-quiz="${quizNum}">
                  <span class="quiz-icon-box" aria-hidden="true">${UI_ICONS.quiz}</span>
                  <span class="chapter-row-text">
                    <span class="chapter-row-title" style="display:block">Шалгалт ${quizNum}: Бүлэг ${rangeStart}–${ch.num}</span>
                    <span class="chapter-row-sub" style="display:block">Хамгийн сайн оноо</span>
                  </span>
                  <span class="quiz-score-pill">${bestScore === null ? 0 : bestScore}/3 ${UI_ICONS.check}</span>
                </button>
              `;
            } else {
              listHtml += `
                <button type="button" class="quiz-row is-locked" data-locked-quiz="${ch.num}">
                  <span class="quiz-icon-box" aria-hidden="true">${UI_ICONS.lock}</span>
                  <span class="chapter-row-text">
                    <span class="chapter-row-title" style="display:block">Шалгалт ${quizNum}: Бүлэг ${rangeStart}–${ch.num}</span>
                    <span class="chapter-row-sub" style="display:block">Бүлэг ${ch.num}-г уншиж дуусгаад нээгдэнэ</span>
                  </span>
                </button>
              `;
            }
          }
        });

        bookDetailScreen.innerHTML = `
          <div class="detail-floating-bar">
            <button type="button" id="detailBackBtn" class="detail-circle-btn" aria-label="Буцах">
              ${UI_ICONS.back}
            </button>
            <button type="button" id="detailSaveBtn" class="detail-circle-btn ${book.saved ? "is-saved" : ""}" aria-label="${book.saved ? "Хадгалснаас хасах" : "Хадгалах"}">
              ${book.saved ? UI_ICONS.heartSolid : UI_ICONS.heartOutline}
            </button>
          </div>

          <div id="detailScroll" class="detail-scroll no-scrollbar">
            <div class="detail-hero">
              <div class="detail-cover-glow" style="background:${book.accent};"></div>
              <div class="detail-cover-box" style="background:${book.gradient};">
                <div class="book-cover-deco" aria-hidden="true">
                  <svg width="100%" height="100%" viewBox="0 0 180 230" preserveAspectRatio="none">
                    <circle cx="150" cy="40" r="66" fill="${book.accent}" fill-opacity="0.26"/>
                    <circle cx="24" cy="196" r="58" fill="#000000" fill-opacity="0.25"/>
                    <rect x="12" y="12" width="156" height="206" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
                  </svg>
                </div>
                <div style="position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center">
                  <span class="badge-cefr">${escapeHtml(book.level)}</span>
                  <span class="badge-lps">LPS ${book.lps}</span>
                </div>
                <div style="position:relative;z-index:2;text-align:center">
                  <div class="detail-cover-title">${escapeHtml(book.title)}</div>
                  <span class="cover-cat-tag">${escapeHtml(book.category)}</span>
                </div>
                <div style="position:relative;z-index:2;text-align:center;font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.78)">
                  Čeština • ${book.chapters.length} бүлэг
                </div>
              </div>

              <div class="detail-pills-row">
                <span class="detail-pill level">${escapeHtml(book.level)}</span>
                <span class="detail-pill lps">LPS ${book.lps}</span>
                <span class="detail-pill age">Нас: ${escapeHtml(book.age)}</span>
                <span class="detail-pill">${getTopicIcon(book.topic)} ${escapeHtml(book.topic)}</span>
              </div>

              <h1 class="detail-title">${escapeHtml(book.title)}</h1>
              <p class="detail-subtitle">${escapeHtml(book.mnSubtitle)}</p>

      /* =========================================================
         8. БҮЛЭГ УНШИХ ЦОНХ (CHAPTER READER MODAL)
         ========================================================= */
      function openChapterReader(bookId, chapterNum) {
        const book = BOOKS.find((b) => b.id === bookId);
        if (!book) return;

        state.activeReadingBookId = book.id; // Одоо "ОДОО УНШИЖ БАЙНА" самбар идэвхжинэ!
        state.reader = {
          bookId: book.id,
          chapterNum: Math.max(1, Math.min(book.chapters.length, chapterNum)),
          showTranslation: false,
          selectedVocabIdx: null,
        };
        renderReaderModal();
        readerOverlay.hidden = false;
      }

      function closeChapterReader() {
        window.AhojReaderExperience?.destroy();
        readerOverlay.hidden = true;
        if (state.detailBookId) renderBookDetail();
        else if (state.activeTab === "read") renderReadingView();
      }

      function renderReaderModal() {
        const book = BOOKS.find((b) => b.id === state.reader.bookId);
        if (!book) return;

        const ch = book.chapters[state.reader.chapterNum - 1];
        const isDone = book.completedChapters.includes(ch.num);

        // Progressive enhancement: full responsive reader and player. Legacy reader remains
        // as a non-audio fallback if the standalone reader module cannot be loaded.
        if (window.AhojReaderExperience?.mount) {
          window.AhojReaderExperience.mount({
            host: readerShell,
            book,
            chapter: ch,
            readingState: state.reader,
            onClose: closeChapterReader,
            onPrevious: () => {
              if (ch.num <= 1) return;
              state.reader.chapterNum = ch.num - 1;
              state.reader.showTranslation = false;
              state.reader.selectedVocabIdx = null;
              renderReaderModal();
            },
            onComplete: () => {
              if (!book.completedChapters.includes(ch.num)) {
                book.completedChapters.push(ch.num);
                showToast("Бүлэг " + ch.num + " уншсанаар тэмдэглэгдлээ.");
                renderReaderModal();
              } else if (ch.num < book.chapters.length) {
                state.reader.chapterNum = ch.num + 1;
                state.reader.showTranslation = false;
                state.reader.selectedVocabIdx = null;
                renderReaderModal();
              } else {
                closeChapterReader();
              }
            }
          });
          return;
        }

        const selectedVocab = state.reader.selectedVocabIdx !== null ? ch.vocab[state.reader.selectedVocabIdx] : null;

        readerShell.innerHTML = `
          <header class="modal-header">
            <div class="modal-head-info">
              <div class="modal-head-title">${escapeHtml(book.title)}</div>
              <div class="modal-head-meta">Бүлэг ${ch.num} / ${book.chapters.length} • ${escapeHtml(book.level)}</div>
            </div>
            <button type="button" id="readerCloseBtn" class="modal-close-btn" aria-label="Хаах">✕</button>
          </header>

          <div class="modal-body no-scrollbar">
            <span class="reader-chapter-pill">Бүлэг ${ch.num} • ${ch.newWords} шинэ үг</span>
            <h2 class="reader-heading">${escapeHtml(ch.title)}</h2>

            <div class="reader-text-card glass-surface">
              ${ch.cz.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}
            </div>

            <button type="button" id="toggleTransBtn" class="trans-toggle-btn glass-pill">
              ${state.reader.showTranslation ? "Монгол орчуулга нуух" : "Монгол орчуулга харах"}
            </button>

            ${state.reader.showTranslation ? `<div class="reader-mn-box">${ch.mn.map((p) => `<p style="margin-bottom:8px">${escapeHtml(p)}</p>`).join("")}</div>` : ""}

            <p class="vocab-section-title">Шинэ үгс (дарж утгыг харна уу)</p>
            <div class="vocab-chips" id="vocabChips">
              ${ch.vocab.map((v, idx) => `
                <button type="button" class="vocab-chip ${state.reader.selectedVocabIdx === idx ? "is-selected" : ""}" data-vocab-idx="${idx}">
                  ${escapeHtml(v.cz)}
                </button>
              `).join("")}
            </div>

            ${selectedVocab ? `
              <div class="vocab-meaning-box">
                <span style="font-weight:800;color:#ffffff">${escapeHtml(selectedVocab.cz)}</span>
                <span style="font-size:13.5px;color:#e8c98a">${escapeHtml(selectedVocab.mn)}</span>
                <button type="button" id="vocabAiHelpBtn"
                  style="margin-top:8px;padding:10px 12px;border-radius:12px;color:#F0D89C;border:1px solid #D96C2E80;background:#D96C2E20;font-size:13px">
                  Энэ үгийг AI-аар контекстэд тайлбарлуулах
                </button>
                <p id="vocabAiAnswer" aria-live="polite" style="white-space:pre-wrap;line-height:1.5;margin-top:8px;font-size:13px"></p>
              </div>
            ` : ""}
          </div>

          <footer class="modal-footer">
            <button type="button" id="readerPrevBtn" class="modal-btn secondary" ${ch.num <= 1 ? "disabled" : ""}>← Өмнөх</button>
            <button type="button" id="readerCompleteBtn" class="modal-btn primary">
              ${isDone ? (ch.num < book.chapters.length ? "Дараагийн бүлэг →" : "Дууссан ✓") : "Бүлгийг дуусгах ✓"}
            </button>
          </footer>
        `;

        document.getElementById("readerCloseBtn").addEventListener("click", closeChapterReader);

        document.getElementById("toggleTransBtn").addEventListener("click", () => {
          state.reader.showTranslation = !state.reader.showTranslation;
          renderReaderModal();
        });

        document.getElementById("vocabChips").addEventListener("click", (e) => {
          const chip = e.target.closest("[data-vocab-idx]");
          if (!chip) return;
          const idx = Number(chip.dataset.vocabIdx);
          state.reader.selectedVocabIdx = state.reader.selectedVocabIdx === idx ? null : idx;
          renderReaderModal();
        });

        const vocabAiBtn = document.getElementById("vocabAiHelpBtn");
        if (selectedVocab && vocabAiBtn) {
          vocabAiBtn.addEventListener("click", async () => {
            const output = document.getElementById("vocabAiAnswer");
            vocabAiBtn.disabled = true;
            if (output) output.textContent = "AI тайлбар ачаалж байна…";
            try {
              const match = ch.cz.find((line) => line.toLocaleLowerCase("cs-CZ").includes(selectedVocab.cz.toLocaleLowerCase("cs-CZ")));
              const response = await fetch("/api/ai/reading-help", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  word: selectedVocab.cz,
                  sentenceCs: (match || ch.cz[0] || "").slice(0, 500),
                  sentenceMn: (ch.mn[0] || "").slice(0, 700),
                  knownMeaningMn: selectedVocab.mn,
                }),
              });
              const data = await response.json();
              if (!response.ok || data.error) throw new Error(data.error || "AI серверийн алдаа.");
              if (output && output.isConnected) {
                output.textContent = [
                  "Өгүүлбэр дэх утга: " + (data.contextMeaningMn || "тодорхойгүй"),
                  data.lemma ? "Үндсэн хэлбэр: " + data.lemma : "",
                  data.grammarMn || "",
                  data.explanationMn || "",
                  data.uncertaintyMn ? "Анхаарах: " + data.uncertaintyMn : "",
                  "Энэ нь AI санал бөгөөд баталгаажсан толь биш.",
                ].filter(Boolean).join("\\n");
              }
            } catch (err) {
              if (output && output.isConnected) {
                output.textContent = "AI холболт ажилласангүй: " + (err instanceof Error ? err.message : "сүлжээний алдаа");
              }
            } finally {
              if (vocabAiBtn.isConnected) vocabAiBtn.disabled = false;
            }
          });
        }

        document.getElementById("readerPrevBtn").addEventListener("click", () => {
          if (ch.num > 1) {
            state.reader.chapterNum = ch.num - 1;
            state.reader.showTranslation = false;
            state.reader.selectedVocabIdx = null;
            renderReaderModal();
          }
        });

        document.getElementById("readerCompleteBtn").addEventListener("click", () => {
          if (!book.completedChapters.includes(ch.num)) {
            book.completedChapters.push(ch.num);
            // Preview: бодитоор хэмжээгүй унших хугацааг зохиож нэмэхгүй.
            if (ch.num % 3 === 0) {
              showToast(`Бүлэг ${ch.num} дууслаа! Шалгалт ${ch.num / 3} нээгдлээ`);
            } else {
              showToast(`Бүлэг ${ch.num} амжилттай дууслаа!`);
            }
            closeChapterReader();
          } else if (ch.num < book.chapters.length) {
            state.reader.chapterNum = ch.num + 1;
            state.reader.showTranslation = false;
            state.reader.selectedVocabIdx = null;
            renderReaderModal();
          } else {
            closeChapterReader();
          }
        });
      }

      /* =========================================================
         9. 3 АСУУЛТТАЙ ШАЛГАЛТ (QUIZ MODAL)
         ========================================================= */
      function openQuizModal(bookId, quizNum) {
        state.quiz = { bookId, quizNum, picks: {}, submitted: false };
        renderQuizModal();
        quizOverlay.hidden = false;
      }

      function closeQuizModal() {
        quizOverlay.hidden = true;
        if (state.detailBookId) renderBookDetail();
      }

      function renderQuizModal() {
        const book = BOOKS.find((b) => b.id === state.quiz.bookId);
        if (!book) return;

        const qNum = state.quiz.quizNum;
        const questions = getBookQuizzes(book, qNum);
        const startCh = (qNum - 1) * 3 + 1;
        const endCh = qNum * 3;
        const allPicked = Object.keys(state.quiz.picks).length === questions.length;

        let score = 0;
        if (state.quiz.submitted) {
          questions.forEach((q, i) => {
            if (state.quiz.picks[i] === q.answer) score++;
          });
        }

        quizShell.innerHTML = `
          <header class="modal-header">
            <div class="modal-head-info">
              <div class="modal-head-title">Шалгалт ${qNum}: Бүлэг ${startCh}–${endCh}</div>
              <div class="modal-head-meta">${escapeHtml(book.title)}</div>
            </div>
            <button type="button" id="quizCloseBtn" class="modal-close-btn" aria-label="Хаах">✕</button>
          </header>

          <div class="modal-body no-scrollbar">
            ${state.quiz.submitted ? `
              <div class="quiz-result-banner">
                <p style="font-size:18px;font-weight:800;color:#ffffff">Таны оноо: ${score} / ${questions.length}</p>
                <p style="margin-top:4px;font-size:13px;color:#cbd5e1">Хамгийн сайн оноо хадгалагдлаа.</p>
              </div>
            ` : ""}

            ${questions.map((q, qIdx) => `
              <div class="quiz-question-card">
                <span class="quiz-q-num">Асуулт ${qIdx + 1} / ${questions.length}</span>
                <p class="quiz-q-text">${escapeHtml(q.q)}</p>
                <div class="quiz-options">
                  ${q.options.map((opt, oIdx) => {
                    const picked = state.quiz.picks[qIdx] === oIdx;
                    let cls = "";
                    if (state.quiz.submitted) {
                      if (oIdx === q.answer) cls = "is-correct";
                      else if (picked) cls = "is-wrong";
                    } else if (picked) {
                      cls = "is-picked";
                    }
                    return `
                      <button type="button" class="quiz-opt-btn ${cls}" data-q="${qIdx}" data-o="${oIdx}" ${state.quiz.submitted ? "disabled" : ""}>
                        ${escapeHtml(opt)}
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>

          <footer class="modal-footer">
            ${state.quiz.submitted
              ? `<button type="button" id="quizRetryBtn" class="modal-btn secondary">Дахин өгөх</button>
                 <button type="button" id="quizDoneBtn" class="modal-btn primary">Дуусгах</button>`
              : `<button type="button" id="quizSubmitBtn" class="modal-btn primary" ${!allPicked ? "disabled" : ""}>Шалгах</button>`
            }
          </footer>
        `;

        document.getElementById("quizCloseBtn").addEventListener("click", closeQuizModal);

        quizShell.querySelectorAll("[data-q]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.quiz.picks[Number(btn.dataset.q)] = Number(btn.dataset.o);
            renderQuizModal();
          });
        });

        const submitBtn = document.getElementById("quizSubmitBtn");
        if (submitBtn) {
          submitBtn.addEventListener("click", () => {
            state.quiz.submitted = true;
            let earned = 0;
            questions.forEach((q, i) => {
              if (state.quiz.picks[i] === q.answer) earned++;
            });
            const prevBest = book.quizScores[qNum];
            book.quizScores[qNum] = prevBest === null ? earned : Math.max(prevBest, earned);
            renderQuizModal();
          });
        }

        const retryBtn = document.getElementById("quizRetryBtn");
        if (retryBtn) {
          retryBtn.addEventListener("click", () => {
            state.quiz.picks = {};
            state.quiz.submitted = false;
            renderQuizModal();
          });
        }

        const doneBtn = document.getElementById("quizDoneBtn");
        if (doneBtn) doneBtn.addEventListener("click", closeQuizModal);
      }

      /* =========================================================
         10. БИЧИХ ДААЛГАВРЫН ЦОНХ (WRITING ASSIGNMENT MODAL)

          book.drafts.conclusion = document.getElementById("draftConclusion").value.trim();
          const saved = countSavedDrafts(book);
          showToast(`Ноорог хадгалагдлаа (${saved}/3 хэсэг)`);
          closeWritingModal();
        });

      /* =========================================================
         11. TAB 3 — AI БАГШ (ИНТЕРАКТИВ ЧАТ)
         ========================================================= */
      function startAiChatForBook(book) {
        bookDetailScreen.hidden = true;
        state.detailBookId = null;
        state.aiContextBookId = book.id;
        state.activeTab = "ai";
        state.aiMessages = [
          {
            role: "ai",
            text: `Ahoj! «${book.title}» (${book.level}) номын тухай хамт ярилцъя.\nГол дүр ${book.hero}-ийн тухай, шинэ үгсийн тайлбар эсвэл чехээр асуулт хариулт хийх үү?`,
          },
        ];
        renderApp();
      }

      /* AI чат — бодит серверийн endpoint; жишээ хариу үүсгэхгүй. */

      function renderAiView() {
        window.__goToStage = null;
        window.__syncTrackResize = null;

        const book = BOOKS.find((b) => b.id === state.aiContextBookId) || null;
        const suggestions = book
          ? ["Гол дүрийн тухай ярилцъя", "Шинэ үгсийг тайлбарла", "Чехээр асуулт асуу"]
          : ["Ahoj! Мэндчилгээ зааж өг", "Өдөр тутмын 5 чех үг", "Надаас чехээр асуулт асуу"];

        mainArea.innerHTML = `
          <div class="ai-view">
            <p style="font-size:11px;color:#D8B56A;padding:5px 13px">
              Gemini чат нь серверийн GEMINI_API_KEY шаарддаг. Хичээл, номын явц нь UI/UX жишээ өгөгдөл.
            </p>
            ${book ? `
              <div class="ai-context-banner">
                <div class="ai-context-thumb" style="background:${book.gradient}">${escapeHtml(book.level)}</div>
                <div class="ai-context-info">
                  <div class="ai-context-tag">Идэвхтэй номын сэдэв</div>
                  <div class="ai-context-title">${escapeHtml(book.title)} · ${escapeHtml(book.mnSubtitle)}</div>
                </div>
                <button type="button" id="clearAiBookBtn" class="ai-context-clear" aria-label="Номын сэдэв салгах">✕</button>
              </div>
            ` : ""}

            <div id="aiMessages" class="ai-messages no-scrollbar">
              ${state.aiMessages.map((m) => `<div class="chat-bubble ${m.role}">${escapeHtml(m.text)}</div>`).join("")}
            </div>

            <div id="aiSuggestions" class="ai-suggestions no-scrollbar">
              ${suggestions.map((s) => `<button type="button" class="ai-chip" data-suggest="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("")}
            </div>

            <form id="aiChatForm" class="ai-input-bar">
              <input type="text" id="aiInput" class="ai-input" placeholder="Чех эсвэл монголоор бичээрэй..." autocomplete="off" />
              <button type="submit" class="ai-send-btn" aria-label="Илгээх">${UI_ICONS.send}</button>
            </form>
          </div>
        `;

        const msgBox = document.getElementById("aiMessages");
        msgBox.scrollTop = msgBox.scrollHeight;

        const clearBtn = document.getElementById("clearAiBookBtn");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            state.aiContextBookId = null;
            renderAiView();
          });
        }

        async function sendUserMessage(text) {
          const clean = String(text || "").trim().slice(0, 1000);
          if (!clean || state.aiBusy) return;
          state.aiBusy = true;
          const history = state.aiMessages
            .filter((m) => m.role === "user" || m.role === "ai")
            .slice(-4)
            .map((m) => ({ role: m.role === "user" ? "user" : "assistant", czech: m.text.slice(0, 350) }));
          state.aiMessages.push({ role: "user", text: clean });
          if (state.activeTab === "ai") renderAiView();
          try {
            const response = await fetch("/api/ai/tutor", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                scenario: book ? book.title : "Чех хэлний өдөр тутмын яриа",
                missionContext: book ? "Тухайн зохиолын тухай зөвхөн баталгаатай контекстээр ярилц." : "",
                userMessage: clean,
                mode: "coach",
                history,
              }),
            });
            const data = await response.json();
            if (!response.ok || data.error) throw new Error(data.error || "AI сервер хариу өгсөнгүй.");
            const reply = [data.replyCzech, data.replyMongolian, data.coachingTipMn]
              .filter((value) => typeof value === "string" && value.trim())
              .join("\n");
            if (!reply) throw new Error("AI сервер хоосон хариу өгсөн.");
            state.aiMessages.push({ role: "ai", text: reply });
          } catch (err) {
            const detail = err instanceof Error ? err.message : "Сүлжээний алдаа";
            state.aiMessages.push({
              role: "ai",
              text: "AI серверийн бодит холболт амжилтгүй: " + detail + "\nЭнэ бол жишээ AI хариу биш.",
            });
          } finally {
            state.aiBusy = false;
            if (state.activeTab === "ai") renderAiView();
          }
        }

        document.getElementById("aiSuggestions").addEventListener("click", (e) => {
          const chip = e.target.closest("[data-suggest]");
          if (chip) sendUserMessage(chip.dataset.suggest);
        });

        document.getElementById("aiChatForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const input = document.getElementById("aiInput");
          sendUserMessage(input.value);
        });
      }

      /* =========================================================
         12. ШҮҮХ ЦОНХ (FILTER BOTTOM SHEET)
         ========================================================= */
      function renderFilterSheet() {
        const f = state.filters;
        resetFiltersBtn.hidden = !hasActiveFilters();

        filterSheetBody.innerHTML = `
          <section>
            <p class="filter-section-label">ТҮРГЭН ШҮҮЛТ</p>
            <div class="pill-row no-scrollbar">
              <button type="button" class="filter-pill solid-active ${f.quick.popular ? "is-active" : ""}" data-quick="popular">
                ${UI_ICONS.flame}<span>Эрэлттэй</span>
              </button>
              <button type="button" class="filter-pill solid-active ${f.quick.saved ? "is-active" : ""}" data-quick="saved">
                ${UI_ICONS.heartSolid}<span>Хадгалсан</span>
              </button>
              <button type="button" class="filter-pill solid-active ${f.quick.finished ? "is-active" : ""}" data-quick="finished">
                ${UI_ICONS.trophy}<span>Уншиж дуусгасан</span>
              </button>
            </div>
          </section>

          <section>
            <p class="filter-section-label">ТҮВШИН</p>
            <div class="pill-row no-scrollbar">
              ${LEVEL_OPTIONS.map((lvl) => `
                <button type="button" class="filter-pill level-pill ${f.level === lvl ? "is-active" : ""}" data-level="${lvl}">
                  <span>${lvl}</span>${lvl === "A0" ? UI_ICONS.star : ""}
                </button>
              `).join("")}
            </div>
          </section>

          <section>
            <p class="filter-section-label">LPS ТҮВШИН</p>
            <div class="pill-row no-scrollbar">
              <button type="button" class="filter-pill lps-pill ${f.lpsRange === "all" ? "is-active" : ""}" data-lps="all">Бүгд</button>
              <button type="button" class="filter-pill lps-pill ${f.lpsRange === "9-25" ? "is-active" : ""}" data-lps="9-25">LPS 9 · 25</button>
            </div>
          </section>

          <section>
            <p class="filter-section-label">ЕРӨНХИЙ СЭДЭВ</p>
            <div class="pill-row no-scrollbar">
              ${TOPIC_OPTIONS.map((topic) => `
                <button type="button" class="filter-pill solid-active ${f.topic === topic ? "is-active" : ""}" data-topic="${escapeHtml(topic)}">
                  ${topic === "Бүгд" ? "" : getTopicIcon(topic)}<span>${escapeHtml(topic)}</span>
                </button>
              `).join("")}
            </div>
          </section>

          <section>
            <p class="filter-section-label">АНГИЛАЛ</p>
            <div class="pill-row no-scrollbar">
              ${CATEGORY_OPTIONS.map((cat) => `
                <button type="button" class="filter-pill solid-active ${f.category === cat ? "is-active" : ""}" data-category="${escapeHtml(cat)}">
                  ${escapeHtml(cat)}
                </button>
              `).join("")}
            </div>
          </section>

          <section>
            <p class="filter-section-label">ТАНД ТОХИРОХ НОМ</p>
            <p class="filter-helper">Сонгосон насны номыг эхэлж харуулна. Сонгохгүй бол бүх ном харагдана.</p>
            <div class="pill-row no-scrollbar">
              ${AGE_OPTIONS.map((age) => `
                <button type="button" class="filter-pill solid-active ${f.agePriority === age.id ? "is-active" : ""}" data-age="${escapeHtml(age.id)}">
                  ${escapeHtml(age.label)}
                </button>
              `).join("")}
            </div>
          </section>
        `;
      }

      function openFilterSheet() {
        renderFilterSheet();
        filterBackdrop.hidden = false;
      }

      function closeFilterSheet() {
        filterBackdrop.hidden = true;
      }

      /* =========================================================
         13. TABS 4 & 5 (КАРТ, ТОЛЬ) БА ЕРӨНХИЙ RENDER
         ========================================================= */
      function renderPlaceholderView(tab) {
        window.__goToStage = null;
        window.__syncTrackResize = null;

        mainArea.innerHTML = `
          <div class="placeholder-wrap no-scrollbar">
            <div class="placeholder-card glass-surface">
              <div class="placeholder-head">
                <span class="placeholder-icon-box glass-tile" aria-hidden="true">
                  <span style="position:relative;z-index:2">${getNavSvg(tab.id, true, 24)}</span>
                </span>
                <h1 class="placeholder-title">${escapeHtml(tab.label)}</h1>
              </div>
              <p class="placeholder-desc">
                Энэ хэсгийн дэлгэц болон шилэн дизайн бэлэн боллоо. Дараагийн алхамд үндсэн функцүүдийг нь нэмж хөгжүүлнэ.
              </p>
              <button type="button" id="placeholderCta" class="placeholder-cta">Үргэлжлүүлэх</button>
            </div>
          </div>
        `;

        document.getElementById("placeholderCta").addEventListener("click", () => {
          showToast(`${tab.label} — дараагийн хэсэгт хийгдэнэ`);
        });
      }

      function renderNav() {
        navGrid.innerHTML = NAV_ITEMS.map((item) => {
          const active = item.id === state.activeTab;
          return `
            <button
              type="button"
              class="nav-btn ${active ? "is-active" : ""}"
              data-tab="${item.id}"
              ${active ? 'aria-current="page"' : ""}
            >
              <span class="nav-icon-wrap" aria-hidden="true">${getNavSvg(item.id, active, 20)}</span>
              <span class="nav-label">${escapeHtml(item.label)}</span>
            </button>
          `;
        }).join("");
      }

      function renderApp() {
        renderNav();
        if (state.activeTab === "stages") renderStagesView();
        else if (state.activeTab === "read") renderReadingView();
        else if (state.activeTab === "ai") renderAiView();
        else {
          const tab = NAV_ITEMS.find((t) => t.id === state.activeTab) || NAV_ITEMS[0];
          renderPlaceholderView(tab);
        }
      }

      /* =========================================================
         14. ЭВЕНТ ХОЛБОЛТ БА ЭХЛҮҮЛЭЛТ
         ========================================================= */
      function init() {
        // Previous PWA installs can keep an old start_url ending in ?tab=read.
        // Normalize it to the single approved Stage-first landing.
        if (new URLSearchParams(window.location.search).get("tab") === "read") {
          const updatedUrl = new URL(window.location.href);
          updatedUrl.searchParams.set("tab", "stages");
          window.history.replaceState(null, "", updatedUrl.pathname + updatedUrl.search + updatedUrl.hash);
        }
        drawerList.innerHTML = MENU_ITEMS.map(
          (label) => `<button type="button" class="drawer-item" data-menu="${escapeHtml(label)}">${escapeHtml(label)}</button>`
        ).join("");

        navGrid.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-tab]");
          if (!btn) return;
          if (!bookDetailScreen.hidden) {
            bookDetailScreen.hidden = true;
            state.detailBookId = null;
          }
          if (btn.dataset.tab === state.activeTab) return;
          state.activeTab = btn.dataset.tab;
          renderApp();
        });

        document.getElementById("openMenuBtn").addEventListener("click", () => {
          drawerBackdrop.hidden = false;
        });
        document.getElementById("closeMenuBtn").addEventListener("click", () => {
          drawerBackdrop.hidden = true;
        });
        drawerBackdrop.addEventListener("click", (e) => {
          if (e.target === drawerBackdrop) drawerBackdrop.hidden = true;
        });
        drawerList.addEventListener("click", (e) => {
          const item = e.target.closest("[data-menu]");
          if (!item) return;
          drawerBackdrop.hidden = true;
          if (item.dataset.menu === "Номын сан" || item.dataset.menu === "Сургалтын хичээлүүд") {
            state.activeTab = item.dataset.menu === "Номын сан" ? "read" : "stages";
            renderApp();
            return;
          }
          showToast(`${item.dataset.menu} — бодит өгөгдөлтэй хараахан холбогдоогүй`);
        });

        document.getElementById("closeFilterBtn").addEventListener("click", closeFilterSheet);
        filterBackdrop.addEventListener("click", (e) => {
          if (e.target === filterBackdrop) closeFilterSheet();
        });
        resetFiltersBtn.addEventListener("click", () => {
          resetAllFilters();
          renderFilterSheet();
          renderReadingView();
        });

        filterSheetBody.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;

          if (btn.dataset.quick) {
            const key = btn.dataset.quick;
            state.filters.quick[key] = !state.filters.quick[key];
          } else if (btn.dataset.level) {
            state.filters.level = state.filters.level === btn.dataset.level ? null : btn.dataset.level;
          } else if (btn.dataset.lps) {
            state.filters.lpsRange = btn.dataset.lps;
          } else if (btn.dataset.topic) {
            state.filters.topic = btn.dataset.topic;
          } else if (btn.dataset.category) {
            state.filters.category = btn.dataset.category;
          } else if (btn.dataset.age) {
            state.filters.agePriority = state.filters.agePriority === btn.dataset.age ? null : btn.dataset.age;
          } else {
            return;
          }

          renderFilterSheet();
          renderReadingView();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (!readerOverlay.hidden && window.AhojReaderExperience?.closeQuickDictionary?.()) return;
            if (!writingOverlay.hidden) closeWritingModal();
            else if (!quizOverlay.hidden) closeQuizModal();
            else if (!readerOverlay.hidden) closeChapterReader();
            else if (!filterBackdrop.hidden) closeFilterSheet();
            else if (!drawerBackdrop.hidden) drawerBackdrop.hidden = true;
            else if (!bookDetailScreen.hidden) closeBookDetail();
          } else if (state.activeTab === "stages" && typeof window.__goToStage === "function") {
            if (e.key === "ArrowLeft") window.__goToStage(state.activeStageIdx - 1);
            if (e.key === "ArrowRight") window.__goToStage(state.activeStageIdx + 1);
          }
        });

        window.addEventListener("resize", () => {
          if (typeof window.__syncTrackResize === "function") window.__syncTrackResize();
        });

        renderApp();
      }

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
  <script>
    // The single installed Ahoj PWA controls the actual reading experience.
    // Register the current service worker; avoid wiping user storage/caches
    // because previous course progress may be stored there.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((registration) => {
          registration.update().catch(() => {});
        }).catch(() => {
          // Unavailable offline mode must not stop reading.
        });
      });
    }
  </script>
</body>
</html>
