<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ahoj Česko" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Čeština • A0</title>
  <link rel="stylesheet" href="./reader-experience.css?v=4" />
  <style>
    /* =========================================================
       1. ҮНДСЭН ӨНГӨ, ХЭМЖЭЭ БА GLASSMORPHISM ТОКЕНУУД
       ========================================================= */
    :root {
      --bg-outer: #000000;
      --bg-shell: #141414;
      --bg-card: #1c1c1e;
      --bg-nav: #171717;
      --bg-elevated: #232326;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-glass: rgba(255, 255, 255, 0.16);
      --text-primary: #ffffff;
      --text-secondary: #b8b8be;
      --text-muted: #8a8a94;
      --accent-orange: #d96c2e;
      --accent-orange-bright: #ee7f3b;
      --accent-gold: #d8b56a;
      --accent-gold-soft: #e8c98a;
      --accent-cyan: #22d3ee;
      --accent-green: #34d399;
      --accent-sage: #7a8a6a;
      --accent-sage-text: #a9b89a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background: var(--bg-outer);
      color: var(--text-primary);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.3;
    }

    [hidden] {
      display: none !important;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================
       2. GLASSMORPHISM ГАДАРГУУНУУД
       ========================================================= */
    .glass-surface {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.025) 100%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 14px 32px rgba(0, 0, 0, 0.4);
    }

    .glass-tile {
      position: relative;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.09) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      box-shadow:
        inset 0 1.5px 1px rgba(255, 255, 255, 0.34),
        inset 0 -10px 22px rgba(0, 0, 0, 0.28),
        0 18px 38px rgba(0, 0, 0, 0.52);
    }

    .glass-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(130deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.02) 44%, transparent 65%);
      pointer-events: none;
    }

    .glass-pill {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* =========================================================
       3. ҮНДСЭН ХҮРЭЭ, ДЭЭД МӨР БА ДООД 5 ТАБ НАВИГАЦИ
       ========================================================= */
    .app-shell {
      position: relative;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-shell);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 16px;
    }

    .menu-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      transition: transform 0.15s ease;
    }

    .menu-btn:active {
      transform: scale(0.9);
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hamburger span {
      display: block;
      width: 17px;
      height: 1.8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.9);
    }

    .main-area {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bottom-nav {
      position: relative;
      z-index: 25;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(23, 23, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 8px max(8px, env(safe-area-inset-bottom, 0px));
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      border-radius: 16px;
      padding: 4px 2px;
      transition: transform 0.15s ease;
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-icon-wrap {
      display: grid;
      place-items: center;
      width: 46px;
      height: 36px;
      border-radius: 14px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .nav-btn.is-active .nav-icon-wrap {
      background: linear-gradient(145deg, rgba(216, 181, 106, 0.24) 0%, rgba(217, 108, 46, 0.16) 55%, rgba(255, 255, 255, 0.07) 100%);
      border-color: rgba(216, 181, 106, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(217, 108, 46, 0.24);
    }

    .nav-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.46);
      transition: color 0.2s ease;
    }

    .nav-btn.is-active .nav-label {
      font-weight: 700;
      color: var(--accent-gold-soft);
    }

    /* =========================================================
       4. TAB 1 — ҮЕ ДАВАХ (STAGES — 100DVH ДОТОР ТҮГЖИГДСЭН)
       ========================================================= */
    .stages-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 16px 10px;
      overflow: hidden;
    }

    .alphabet-banner {
      width: 100%;
      flex-shrink: 0;
      border-radius: 22px;
      padding: 12px 14px;
      text-align: left;
      transition: transform 0.15s ease;
    }

    .alphabet-banner:active {
      transform: scale(0.98);
    }

    .alphabet-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .alphabet-tile {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 15px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      background: radial-gradient(circle at 30% 20%, rgba(217, 108, 46, 0.48), rgba(255, 255, 255, 0.06) 72%);
    }

    .alphabet-copy {
      min-width: 0;
      flex: 1;
    }

    .alphabet-title {
      display: block;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
    }

    .alphabet-sub {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.64);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alphabet-chevron {
      flex-shrink: 0;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.48);
    }

    .carousel-shell {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      overscroll-behavior: none;
      touch-action: pan-x;
    }

    .chapter-slide {
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 4px;
    }

    .chapter-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: var(--bg-card);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.48);
    }

    .chapter-hero {
      position: relative;
      flex: 1.04;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: linear-gradient(180deg, #101114 0%, #151518 62%, #111113 100%);
    }

    .chapter-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .chapter-top-line {
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      pointer-events: none;
    }

    .emblem-area {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
    }

    .emblem-frame {
      width: clamp(86px, 13.5dvh, 122px);
      height: clamp(86px, 13.5dvh, 122px);
      border-radius: 26px;
      display: grid;
      place-items: center;
    }

    .chapter-hero-caption {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      padding: 4px 18px 12px;
      text-align: left;
    }

    .cefr-hero-pill {
      display: inline-flex;
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
    }

    .chapter-cz-word {
      margin-top: 5px;
      font-size: clamp(20px, 2.8dvh, 24px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.96);
    }

    .chapter-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 13px 18px 15px;
      text-align: center;
    }

    .chapter-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mini-tag {
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .mini-tag.status {
      background: rgba(122, 138, 106, 0.22);
      color: var(--accent-sage-text);
    }

    .chapter-title {
      margin-top: 9px;
      font-size: clamp(19px, 2.8dvh, 23px);
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }

    .chapter-subtitle {
      margin-top: 3px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .chapter-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .chapter-pct {
      border-radius: 9999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .progress-track {
      margin-top: 7px;
      height: 6px;
      overflow: hidden;
      border-radius: 9999px;
      background: #2a2a2d;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .chapter-cta {
      width: 100%;
      border-radius: 9999px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .chapter-cta:active {
      transform: scale(0.97);
    }

    .carousel-arrow {
      position: absolute;
      top: 18%;
      z-index: 15;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      font-size: 20px;
      color: #ffffff;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .carousel-arrow:active:not(:disabled) {
      transform: scale(0.9);
    }

    .carousel-arrow.prev { left: 10px; }
    .carousel-arrow.next { right: 10px; }

    .carousel-footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 2px;
    }

    .dots-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dot-btn {
      height: 7px;
      width: 7px;
      border-radius: 9999px;
      background: #3a3a3e;
      transition: width 0.28s ease, height 0.28s ease, background-color 0.28s ease;
    }

    .chapter-counter {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* =========================================================
       5. TAB 2 — УНШИХ (НОМЫН САН)
       ========================================================= */
    .reading-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 16px 24px;
      -webkit-overflow-scrolling: touch;
      transition: padding-bottom 0.25s ease;
    }

    .reading-scroll.has-floating-bar {
      padding-bottom: 112px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      height: 46px;
      border-radius: 16px;
      background: #1c1c1f;
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 0 12px;
      gap: 9px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-box:focus-within {
      border-color: rgba(217, 108, 46, 0.55);
      background: #202024;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: none;
      font-size: 14.5px;
      color: #ffffff;
    }

    .search-input::placeholder {
      color: #7d7d86;
    }

    .search-clear-btn {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
    }

    .filter-trigger-btn {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 16px;
      background: var(--accent-orange);
      color: #141414;
      box-shadow: 0 8px 20px rgba(217, 108, 46, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.15s ease;
    }

    .filter-trigger-btn:active {
      transform: scale(0.93);
    }

    .filter-badge-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #fff7e0;
      box-shadow: 0 0 0 2px var(--accent-orange);
    }

    .library-header {
      margin-top: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .library-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
    }

    .library-sub {
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .count-pill {
      flex-shrink: 0;
      border-radius: 9999px;
      background: #1f1f23;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .active-filters-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 2px;
    }

    .active-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(217, 108, 46, 0.18);
      border: 1px solid rgba(217, 108, 46, 0.45);
      color: #f6b58b;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .book-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.36);
      text-align: left;
      transition: transform 0.16s ease, border-color 0.2s ease;
    }

    .book-card:active {
      transform: scale(0.97);
    }

    .book-card.is-reading {
      border-color: rgba(217, 108, 46, 0.5);
    }

    .book-cover {
      position: relative;
      aspect-ratio: 3 / 3.7;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .book-cover-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .book-cover-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .book-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge-cefr {
      border-radius: 9999px;
      background: rgba(14, 165, 198, 0.92);
      color: #ffffff;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.32);
    }

    .badge-lps {
      border-radius: 9999px;
      background: rgba(18, 18, 22, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.9);
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .bookmark-btn {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: rgba(16, 16, 20, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.85);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .bookmark-btn:active {
      transform: scale(0.86);
    }

    .bookmark-btn.is-saved {
      background: rgba(217, 108, 46, 0.92);
      border-color: rgba(255, 255, 255, 0.32);
      color: #ffffff;
    }

    .cover-center-title {
      position: relative;
      z-index: 2;
      padding: 4px;
      text-align: center;
    }

    .cover-main-text {
      font-size: 16.5px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
      word-break: break-word;
    }

    .cover-cat-tag {
      display: inline-block;
      margin-top: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 2px 8px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.94);
    }

    .book-cover-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .age-pill {
      border-radius: 8px;
      background: rgba(15, 15, 18, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
    }

    .done-pill {
      border-radius: 8px;
      background: rgba(52, 211, 153, 0.24);
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #6ee7b7;
      padding: 2px 6px;
      font-size: 9.5px;
      font-weight: 800;
    }

    .book-progress-strip {
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
    }

    .book-progress-strip-fill {
      height: 100%;
      background: var(--accent-orange);
    }

    .book-info {
      padding: 10px 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .book-title {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-mn-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-meta {
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #9e9ea7;
    }

    .empty-state {
      margin-top: 14px;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .empty-sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .empty-reset-btn {
      margin-top: 16px;
      border-radius: 9999px;
      background: var(--accent-orange);
      color: #ffffff;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
    }

    /* =========================================================
       6. ХӨВДӨГ "ОДОО УНШИЖ БАЙНА" САМБАР (АНХ НУУЦ БАЙНА)
       ========================================================= */
    .floating-reading-bar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 20px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(46, 30, 20, 0.94) 0%, rgba(24, 21, 20, 0.96) 100%);
      border: 1px solid rgba(217, 108, 46, 0.4);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 16px 36px rgba(0, 0, 0, 0.65);
      animation: bar-slide-up 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      cursor: pointer;
    }

    .mini-thumb {
      width: 44px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 4px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .mini-thumb-text {
      font-size: 8.5px;
      font-weight: 900;
      line-height: 1.08;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .floating-center {
      flex: 1;
      min-width: 0;
    }

    .floating-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e8945e;
    }

    .floating-book-title {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .floating-progress-wrap {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .floating-progress-track {
      flex: 1;
      height: 5px;
      border-radius: 9999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
    }

    .floating-progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #d96c2e, #f29a52);
      transition: width 0.25s ease;
    }

    .floating-pct {
      font-size: 11.5px;
      font-weight: 800;
      color: #f29a52;
    }

    .floating-play-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: var(--accent-orange);
      color: #141414;
      box-shadow: 0 6px 18px rgba(217, 108, 46, 0.45);
      transition: transform 0.15s ease;
    }

    .floating-play-btn:active {
      transform: scale(0.9);
    }

    /* =========================================================
       7. "НОМЫН ДЭЛГЭРЭНГҮЙ" (BOOK DETAIL SCREEN INSIDE SHELL)
       ========================================================= */
    .detail-screen {
      position: absolute;
      inset: 0;
      z-index: 35;
      display: flex;
      flex-direction: column;
      background: var(--bg-shell);
      padding-top: env(safe-area-inset-top, 0px);
      animation: slide-in-right 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .detail-floating-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .detail-circle-btn {
      pointer-events: auto;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background: rgba(28, 28, 32, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .detail-circle-btn:active {
      transform: scale(0.9);
    }

    .detail-circle-btn.is-saved {
      background: rgba(217, 108, 46, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .detail-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 58px 16px 24px;
      -webkit-overflow-scrolling: touch;
    }

    /* Төвд байрлах номын хавтас + зөөлөн туяа */
    .detail-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 6px;
    }

    .detail-cover-glow {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      border-radius: 9999px;
      filter: blur(46px);
      opacity: 0.34;
      pointer-events: none;
    }

    .detail-cover-box {
      position: relative;
      z-index: 2;
      width: 172px;
      aspect-ratio: 3 / 3.85;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .detail-cover-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #ffffff;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    .detail-pills-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .detail-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 9999px;
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #212126;
      color: rgba(255, 255, 255, 0.88);
    }

    .detail-pill.level {
      background: rgba(217, 108, 46, 0.22);
      border-color: rgba(217, 108, 46, 0.65);
      color: #f6a976;
    }

    .detail-pill.lps {
      background: rgba(148, 163, 184, 0.22);
      border-color: rgba(148, 163, 184, 0.36);
      color: #e2e8f0;
    }

    .detail-pill.age {
      background: rgba(59, 130, 246, 0.14);
      border-color: rgba(96, 165, 250, 0.28);
      color: #cbd5e1;
    }

    .detail-title {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.22;
      color: #ffffff;
    }

    .detail-subtitle {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* 3 баганатай статистик карт */
    .stats-card {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-radius: 22px;
      background: #1a1a1d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .stat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      padding: 0 6px;
    }

    .stat-col:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 14%;
      bottom: 14%;
      width: 1px;
      background: rgba(255, 255, 255, 0.09);
    }

    .stat-icon-circle {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-icon-circle.blue {
      background: rgba(59, 130, 246, 0.18);
      color: #60a5fa;
    }

    .stat-icon-circle.purple {
      background: rgba(168, 85, 247, 0.18);
      color: #c084fc;
    }

    .stat-icon-circle.green {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Зохиолын тухай */
    .detail-section {
      margin-top: 22px;
    }

    .detail-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }

    .detail-section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 16.5px;
      font-weight: 800;
      color: #ffffff;
    }

    .detail-progress-count {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--accent-orange-bright);
    }

    .detail-about-text {
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--text-secondary);
    }

    /* Бүлгүүд ба Шалгалтын жагсаалт */
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 18px;
      background: #1b1b1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 13px 14px;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .chapter-row:active {
      transform: scale(0.985);
      background: #222226;
    }

    .chapter-num-circle {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: #26262b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13.5px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.85);
    }

    .chapter-row-text {
      flex: 1;
      min-width: 0;
    }

    .chapter-row-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: #ffffff;
    }

    .chapter-row-sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .chapter-done-check {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--accent-green);
    }

    /* 3 бүлэг тутмын Шалгалт карт */
    .quiz-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      border-radius: 20px;
      padding: 14px;
      text-align: left;
      transition: transform 0.15s ease;
    }

    .quiz-row.is-locked {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.07);
      opacity: 0.78;
    }

    .quiz-row.is-unlocked {
      background: linear-gradient(135deg, rgba(84, 45, 20, 0.56) 0%, rgba(40, 24, 15, 0.62) 100%);
      border: 1px solid rgba(217, 108, 46, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .quiz-row.is-unlocked:active {
      transform: scale(0.985);
    }

    .quiz-icon-box {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
    }

    .quiz-row.is-locked .quiz-icon-box {
      background: #232327;
      color: #7c7c86;
    }

    .quiz-row.is-unlocked .quiz-icon-box {
      background: rgba(217, 108, 46, 0.32);
      border: 1px solid rgba(238, 127, 59, 0.45);
      color: #f6a063;
    }

    .quiz-score-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 9999px;
      background: rgba(52, 211, 153, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.32);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      color: #5eead4;
    }

    /* Бичих даалгавар карт */
    .writing-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      border-radius: 20px;
      padding: 15px 14px;
      text-align: left;
      background: linear-gradient(135deg, rgba(72, 42, 20, 0.52) 0%, rgba(34, 22, 14, 0.6) 100%);
      border: 1px solid rgba(217, 108, 46, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.15s ease;
    }

    .writing-card:active {
      transform: scale(0.985);
    }

    .writing-icon-box {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(217, 108, 46, 0.35);
      color: #f49b5c;
    }

    /* Доод бэхлэгдсэн үйлдлийн самбар (Үргэлжлүүлэн унших + Цоожгүй AI товч) */
    .detail-sticky-footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px 16px max(14px, env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(20, 20, 20, 0.88) 0%, #141414 28%);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .detail-primary-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 16px;
      background: linear-gradient(90deg, #f0952c 0%, #d96c2e 100%);
      color: #141414;
      padding: 14px 16px;
      font-size: 15.5px;
      font-weight: 800;
      box-shadow: 0 10px 26px rgba(217, 108, 46, 0.42);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .detail-primary-btn:active {
      transform: scale(0.98);
    }

    .detail-ai-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09) 0%, rgba(217, 108, 46, 0.12) 100%);
      border: 1px solid rgba(216, 181, 106, 0.34);
      color: var(--accent-gold-soft);
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .detail-ai-btn:active {
      transform: scale(0.98);
      background: rgba(217, 108, 46, 0.2);
    }

    /* =========================================================
       8. ШҮҮХ ЦОНХ (FILTER BOTTOM SHEET)
       ========================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.66);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fade-in 0.18s ease-out both;
    }

    .sheet-panel {
      width: 100%;
      max-width: 430px;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      border-radius: 28px 28px 0 0;
      background: #1a1a1d;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.65);
      padding: 10px 18px max(16px, env(safe-area-inset-bottom, 0px));
      animation: sheet-up 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.22);
      margin: 0 auto 12px;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .sheet-reset-btn {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-orange-bright);
      padding: 4px 8px;
      border-radius: 10px;
    }

    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 16px;
    }

    .filter-section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8a94;
      margin-bottom: 9px;
    }

    .filter-helper {
      font-size: 11.5px;
      line-height: 1.4;
      color: #8a8a94;
      margin-top: -4px;
      margin-bottom: 9px;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 9999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.86);
      background: #242428;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.16s ease;
    }

    .filter-pill:active {
      transform: scale(0.95);
    }

    .filter-pill.level-pill {
      border-radius: 14px;
      padding: 9px 15px;
    }

    .filter-pill.level-pill.is-active {
      background: rgba(34, 211, 238, 0.16);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .filter-pill.lps-pill {
      border-radius: 14px;
      padding: 9px 15px;
    }

    .filter-pill.lps-pill.is-active {
      background: rgba(217, 108, 46, 0.22);
      border-color: var(--accent-orange-bright);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(217, 108, 46, 0.32);
    }

    .filter-pill.solid-active.is-active {
      background: var(--accent-orange);
      border-color: var(--accent-orange-bright);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(217, 108, 46, 0.32);
    }

    .sheet-close-btn {
      flex-shrink: 0;
      width: 100%;
      border-radius: 16px;
      background: var(--accent-orange);
      color: #141414;
      padding: 14px 16px;
      font-size: 15.5px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(217, 108, 46, 0.36);
    }

    /* =========================================================

       ========================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: flex;

      background: rgba(0, 0, 0, 0.82);
      animation: fade-in 0.18s ease-out both;

    .modal-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #141416;
      padding-top: env(safe-area-inset-top, 0px);
      animation: sheet-up 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .modal-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    .modal-head-info {
      min-width: 0;
      flex: 1;
    }

    .modal-head-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;

    }

    .modal-head-meta {

    .modal-close-btn {

      width: 38px;
      height: 38px;

    .modal-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px 24px;
    }

    .modal-footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px max(14px, env(safe-area-inset-bottom, 0px));

      background: #17171a;

    /* Уншигч доторх хэв маяг */
    .reader-chapter-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      background: rgba(217, 108, 46, 0.18);
      border: 1px solid rgba(217, 108, 46, 0.42);

      font-size: 11.5px;
      font-weight: 800;
      color: #f4a46f;
    }

    .reader-heading {
      margin-top: 10px;

      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
    }

    .reader-text-card {

      padding: 18px;

      gap: 12px;

    .trans-toggle-btn {
      margin-top: 14px;

      padding: 9px 14px;

      font-weight: 700;

    .reader-mn-box {
      margin-top: 12px;
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(216, 181, 106, 0.08);
      border: 1px solid rgba(216, 181, 106, 0.24);

    .vocab-section-title {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .vocab-chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vocab-chip {
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      background: #222227;
      border: 1px solid rgba(255, 255, 255, 0.1);

    .vocab-chip.is-selected {

    .modal-btn {

      font-size: 14.5px;
      font-weight: 800;
      text-align: center;

    .modal-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .modal-btn.secondary {
      background: #252529;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-btn.primary {
      background: var(--accent-orange);
      color: #141414;
      box-shadow: 0 8px 20px rgba(217, 108, 46, 0.36);
    }

    /* Шалгалт модал */
    .quiz-question-card {
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      background: #1b1b1f;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .quiz-q-num {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-orange-bright);
    }

    .quiz-q-text {
      margin-top: 6px;
      font-size: 15.5px;
      font-weight: 700;

      color: #ffffff;
    }

    .quiz-options {
      margin-top: 12px;

      flex-direction: column;
      gap: 8px;
    }

    .quiz-opt-btn {
      width: 100%;
      border-radius: 13px;
      padding: 11px 13px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 600;

    .quiz-opt-btn.is-picked {
      background: rgba(217, 108, 46, 0.22);

    }

    .quiz-opt-btn.is-correct {
      background: rgba(52, 211, 153, 0.2);
      border-color: var(--accent-green);
      color: #a7f3d0;
    }

    .quiz-opt-btn.is-wrong {
      background: rgba(248, 113, 113, 0.2);
      border-color: #f87171;
      color: #fecaca;
    }

    .quiz-result-banner {
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.16), rgba(217, 108, 46, 0.16));
      border: 1px solid rgba(52, 211, 153, 0.35);
    }

    /* Бичих даалгавар модал */
    .writing-field {
      margin-bottom: 16px;
    }

    .writing-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 7px;
    }

    .writing-hint {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .writing-textarea {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border-radius: 16px;
      background: #1c1c21;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      color: #ffffff;
      outline: none;
    }

    .writing-textarea:focus {
      border-color: rgba(217, 108, 46, 0.65);
    }

    /* =========================================================
       10. TAB 3 — AI БАГШ (ИНТЕРАКТИВ ЧАТ)
       ========================================================= */
    .ai-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ai-context-banner {
      flex-shrink: 0;
      margin: 4px 16px 8px;
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(217, 108, 46, 0.18), rgba(216, 181, 106, 0.08));
      border: 1px solid rgba(217, 108, 46, 0.38);
    }

    .ai-context-thumb {
      width: 34px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
    }

    .ai-context-info {
      flex: 1;
      min-width: 0;
    }

    .ai-context-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #f6a976;
    }

    .ai-context-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ai-context-clear {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
    }

    .ai-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 86%;
      border-radius: 18px;
      padding: 11px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-line;
      animation: fade-in 0.18s ease-out both;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: #1e1e23;
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.94);
      border-bottom-left-radius: 6px;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: var(--accent-orange);
      color: #ffffff;
      font-weight: 600;
      border-bottom-right-radius: 6px;
      box-shadow: 0 6px 16px rgba(217, 108, 46, 0.3);
    }

    .ai-suggestions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 6px 16px 8px;
    }

    .ai-chip {
      flex-shrink: 0;
      border-radius: 9999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      background: #212126;
      border: 1px solid rgba(216, 181, 106, 0.28);
      color: var(--accent-gold-soft);
      transition: transform 0.15s ease;
    }

    .ai-chip:active {
      transform: scale(0.95);
    }

    .ai-input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      background: #161618;
    }

    .ai-input {
      flex: 1;
      height: 44px;
      border-radius: 14px;
      background: #212126;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 13px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
    }

    .ai-input:focus {
      border-color: rgba(217, 108, 46, 0.6);
    }

    .ai-send-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
      background: var(--accent-orange);
      color: #141414;
      box-shadow: 0 6px 16px rgba(217, 108, 46, 0.35);
    }

    .ai-send-btn:active {
      transform: scale(0.93);
    }

    /* =========================================================
       11. TABS 4–5 (КАРТ, ТОЛЬ), DRAWER & TOAST
       ========================================================= */
    .placeholder-wrap {
      flex: 1;
      padding: 10px 16px 24px;
      overflow-y: auto;
    }

    .placeholder-card {
      border-radius: 28px;
      padding: 20px;
    }

    .placeholder-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .placeholder-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .placeholder-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .placeholder-desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .placeholder-cta {
      margin-top: 20px;
      width: 100%;
      border-radius: 9999px;
      background: var(--accent-orange);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 10px 26px rgba(217, 108, 46, 0.34);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      justify-content: flex-end;
      padding: max(14px, env(safe-area-inset-top, 0px)) 12px 14px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fade-in 0.18s ease-out both;
    }

    .drawer-panel {
      width: 100%;
      max-width: 295px;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      animation: drawer-in 0.22s ease-out both;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 17px;
      font-weight: 800;
    }

    .drawer-close {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      background: #2b2b2f;
      font-size: 17px;
    }

    .drawer-list {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drawer-item {
      border-radius: 14px;
      padding: 13px 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .drawer-item:hover {
      background: #2a2a2e;
    }

    .drawer-item:active {
      background: #333338;
      transform: scale(0.98);
    }

    .drawer-footer {
      margin-top: auto;
      padding-top: 20px;
    }

    .drawer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 16px;
      padding: 11px 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.88);
    }

    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      z-index: 75;
      width: calc(100% - 32px);
      max-width: 380px;
      transform: translateX(-50%);
      border-radius: 16px;
      background: #ffffff;
      color: #111111;
      padding: 12px 16px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
      animation: toast-in 0.18s ease-out both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes drawer-in {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }

    @keyframes slide-in-right {
      from { opacity: 0.5; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes sheet-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    @keyframes bar-slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
  
    /* =========================================================
       MOBILE VIEWPORT v1 — preserve iPhone safe areas, keep the
       bottom navigation anchored, and scroll short screens.
       Layout only: no palette, lesson data, audio or AI changes.
       ========================================================= */
    .app-shell {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    .topbar {
      min-height: 52px;
      padding: 6px 14px;
    }

    .bottom-nav {
      padding: 4px 8px max(8px, env(safe-area-inset-bottom, 0px));
    }

    .nav-btn {
      gap: 3px;
      padding-block: 3px;
    }

    .nav-icon-wrap {
      height: 34px;
    }

    .stages-container {
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      gap: 10px;
      padding: 6px 14px 12px;
    }
    .stages-container::-webkit-scrollbar { display: none; }

    .carousel-shell {
      /* Keep a swipeable stage track, but don't enlarge its card indefinitely. */
      flex: 1 0 390px;
      min-height: 390px;
    }

    .chapter-slide {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chapter-card {
      width: 100%;
      height: min(100%, clamp(390px, calc(100dvh - 350px), 580px));
      flex-shrink: 0;
    }

    .carousel-track {
      /* Allow vertical motion to reach the parent on compact phones. */
      touch-action: auto;
      overscroll-behavior-x: contain;
    }

    .chapter-hero {
      flex: 0 0 42%;
      min-height: 0;
    }

    .emblem-frame {
      width: clamp(80px, 10.5dvh, 108px);
      height: clamp(80px, 10.5dvh, 108px);
    }

    .chapter-body {
      flex: 1 1 auto;
      min-height: 0;
      gap: 10px;
      padding: 12px 16px 14px;
      justify-content: flex-start;
    }

    .chapter-body > div:nth-child(2) { margin-top: auto; }
    .chapter-cta { min-height: 44px; margin-top: 14px; }

    @media (max-width: 360px) {
      .stages-container { padding-inline: 10px; }
      .alphabet-banner { padding: 10px 11px; }
      .alphabet-row { gap: 9px; }
      .alphabet-title { font-size: 14px; }
      .alphabet-sub { font-size: 11px; }
      .chapter-title { font-size: 18px; }
      .chapter-body { padding-inline: 12px; }
      .nav-grid { gap: 1px; }
      .nav-label { font-size: 10px; }
    }

    @media (max-height: 700px) {
      .topbar { min-height: 46px; padding-block: 3px; }
      .alphabet-banner { padding-block: 9px; }
      .stages-container { gap: 7px; padding-block: 4px 10px; }
      .chapter-card { height: min(100%, 390px); }
      .chapter-hero { flex-basis: 40%; }
      .chapter-hero-caption { padding-bottom: 8px; }
      .chapter-body { gap: 8px; }
      .bottom-nav { padding-top: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .carousel-track { scroll-behavior: auto; }
    }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      /* =========================================================
         4. ШҮҮЛТҮҮРИЙН ЛОГИК (УНШИХ ТАБ)
         ========================================================= */
      function hasActiveFilters() {
        const f = state.filters;
        return (
          f.quick.popular ||
          f.quick.saved ||
          f.quick.finished ||
          f.level !== null ||
          f.lpsRange !== "all" ||
          f.topic !== "Бүгд" ||
          f.category !== "Бүгд" ||
          f.agePriority !== null
        );
      }

      function resetAllFilters() {
        state.filters = {
          quick: { popular: false, saved: false, finished: false },
          level: null,
          lpsRange: "all",
          topic: "Бүгд",
          category: "Бүгд",
          agePriority: null,
        };
        state.searchQuery = "";
      }

      function getFilteredBooks() {
        const q = state.searchQuery.trim().toLowerCase();
        const f = state.filters;

        const filtered = BOOKS.filter((book) => {
          if (q) {
            const hay = `${book.title} ${book.mnSubtitle} ${book.category} ${book.topic} ${book.level}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          if (f.quick.popular && !book.popular) return false;
          if (f.quick.saved && !book.saved) return false;
          if (f.quick.finished && getBookProgress(book) < 100) return false;
          if (f.level && book.level !== f.level) return false;
          if (f.lpsRange === "9-25" && (book.lps < 9 || book.lps > 25)) return false;
          if (f.topic !== "Бүгд" && book.topic !== f.topic) return false;
          if (f.category !== "Бүгд" && book.category !== f.category) return false;
          return true;
        });

        if (f.agePriority) {
          filtered.sort((a, b) => (a.age === f.agePriority ? 0 : 1) - (b.age === f.agePriority ? 0 : 1));
        }

        return filtered;
      }
