name: One-time merged alphabet review branch prune
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'enkhbat194/Ahoj-esko' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[prune-alphabet-review-20261120]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only verified PR 14 merged source branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner='enkhbat194',repo='Ahoj-esko';
            const source='fix/alphabet-seven-step-review-20261120';
            const expected='6c3b4298e2414c7e1df47b9478ada2e885936321';
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:14})).data;
            if(!pr.merged_at || pr.state!=='closed'||pr.head.ref!==source||
               pr.head.sha!==expected||pr.base.ref!=='main')throw Error('PR #14 mismatch');
            const b=(await github.rest.repos.getBranch({owner,repo,branch:source})).data;
            if(b.commit.sha!==expected||b.protected)throw Error('Source changed');
            const live=(await github.rest.repos.getBranch({owner,repo,branch:'preview/ios-l01-render-static-20261120'})).data;
            if(!live.commit.sha)throw Error('Preview branch missing');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+source});
            core.info('Removed merged PR 14 source; retained main + preview.');
