name: Ahoj Render HTTP Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-smoke.yml
      - scripts/smoke_render_preview.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployed Preview over HTTPS
        run: python scripts/smoke_render_preview.py
