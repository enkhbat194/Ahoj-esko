name: One-time verified branch prune
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    # Explicitly user-authorized cleanup; never run on routine commits.
    if: github.repository == 'enkhbat194/Ahoj-esko' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[branch-prune-20261120]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preflight exact branch heads, merged PRs and backup tag before deletion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = 'enkhbat194', repo = 'Ahoj-esko';
            const preview = 'preview/ios-l01-render-static-20261120';
            const archived = 'feature/ahoj-golden-slice-v099';
            const archiveTag = 'archive/golden-slice-v099-20261120';
            const goldenSha = 'dd940304d014105c1b92f17e9e18a1aae6fb9273';
            const items =
            [
              {
                "name": "docs/project-control-20261120",
                "sha": "b83fa62a60c6faaf5f21e8ba0f5bec536780239b",
                "pr": 6,
                "base": "main"
              },
              {
                "name": "feat/canonical-exercise-exit-catalog-20261120",
                "sha": "e63c5a80df93e9b2a9ec77a99d345da22ac73120",
                "pr": 7,
                "base": "main"
              },
              {
                "name": "feat/l01-dialogue-turn-training-20261120",
                "sha": "7afc91c7b547a57521ba4c585226b35e7daf220d",
                "pr": 11,
                "base": "preview/ios-l01-render-static-20261120"
              },
              {
                "name": "feat/l01-source-locked-lesson-flow-20261120",
                "sha": "c3df67cc2d569c83c11efc179f694a16a725582c",
                "pr": 8,
                "base": "main"
              },
              {
                "name": "feat/72-lesson-preview-import-20261120",
                "sha": "b537a15184357ca1a62c1bbe5db00960026acc5c",
                "pr": 4,
                "base": "main"
              },
              {
                "name": "fix/drive-canonical-import-20261120",
                "sha": "344ca00c0c4cf7faabc7c7cfdb54f55c85cb8589",
                "pr": 3,
                "base": "main"
              },
              {
                "name": "fix/main-safety-and-canonical-dedup-20261117",
                "sha": "7656914f3ed6326fc34a47ca6f7e663dbd06e106",
                "pr": 2,
                "base": "main"
              },
              {
                "name": "fix/today-l01-source-locked-20261120",
                "sha": "17646a981d2b33ccb83894a5025405da3e421285",
                "pr": 9,
                "base": "main"
              }
            ];
            if (context.repo.owner !== owner || context.repo.repo !== repo || context.ref !== 'refs/heads/main') {
              throw new Error('Wrong repository or branch; aborting');
            }
            const protectedBranches = new Set(['main', preview]);
            const getBranch = async name => (await github.rest.repos.getBranch({owner, repo, branch:name})).data;
            // Fail closed if an active Render source is missing.
            await getBranch(preview);
            const checkPlan = [];
            for (const item of items) {
              if (protectedBranches.has(item.name)) throw new Error('Protected ref in prune list: ' + item.name);
              const [branch, pull] = await Promise.all([
                getBranch(item.name),
                github.rest.pulls.get({owner,repo,pull_number:item.pr}).then(r=>r.data)
              ]);
              if (branch.commit.sha !== item.sha || pull.head.ref !== item.name ||
                  pull.head.sha !== item.sha || pull.base.ref !== item.base || !pull.merged_at) {
                throw new Error('Unverified/surviving branch modification: ' + item.name);
              }
              checkPlan.push(item.name);
            }
            const [goldBranch, goldenPull] = await Promise.all([
              getBranch(archived), github.rest.pulls.get({owner,repo,pull_number:1}).then(r=>r.data)
            ]);
            if (goldBranch.commit.sha !== goldenSha || goldenPull.head.ref !== archived ||
                goldenPull.head.sha !== goldenSha || goldenPull.merged_at ||
                goldenPull.state !== 'closed') {
              throw new Error('Golden slice backup source changed; refusing deletion');
            }
            // Preserve every nonmerged Golden Slice file under a named immutable commit tag.
            try {
              const tag = await github.rest.git.getRef({owner,repo,ref:'tags/'+archiveTag});
              if (tag.data.object.sha !== goldenSha) throw new Error('Archive tag ref collision');
              core.info('Existing golden-slice archive tag verified.');
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+archiveTag,sha:goldenSha});
              core.info('Archived nonmerged Golden Slice commit in refs/tags/'+archiveTag);
            }
            // Repeat SHA checks just before each destructive call to protect against concurrent edits.
            for (const name of [...checkPlan,archived]) {
              const expected = name === archived ? goldenSha : items.find(t=>t.name===name).sha;
              const live = await getBranch(name);
              if (live.commit.sha !== expected) throw new Error('Branch head moved during cleanup: '+name);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
              core.info('Deleted verified branch: '+name);
            }
            const survivor = await getBranch(preview);
            core.info('Surviving Render Preview branch: '+survivor.name);
            core.info('Surviving main branch remains protected by the prune allowlist.');
