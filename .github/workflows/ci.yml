name: Test Ahoj Cesko

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npx tsx --test src/utils/*.test.ts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Speaking pilot mobile browser QA
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/check-speaking-browser.mjs
      - name: Upload speaking pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-pilot-browser-evidence
          path: test-artifacts/speaking-*.png
          if-no-files-found: ignore
