name: Test Ahoj Cesko

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npx tsx --test src/utils/*.test.ts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build

  # One-time owner-authorized cleanup after the exact consolidation squash lands.
  # Keep the current main tree; merge old branch ancestry with the 'ours' strategy
  # before deleting refs so no old branch-only commit becomes unreachable.
  consolidate_on_main:
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: one-main-uiux-final-20261122') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve all old branch histories and prune branch refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B main origin/main
          mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sed 's#^origin/##' | grep -v '^main$' || true)
          printf 'Found %s non-main branches for archival.\\n' "${#branches[@]}"
          for branch in "${branches[@]}"; do
            printf 'Preserving ancestry for %s\\n' "$branch"
            git merge --no-ff -s ours --no-edit -m "archive: preserve prior branch $branch" "refs/remotes/origin/$branch"
          done
          git push origin main
          failures=0
          for branch in "${branches[@]}"; do
            printf 'Deleting archived ref %s\\n' "$branch"
            if ! git push origin --delete "$branch"; then
              printf 'FAILED deletion: %s\\n' "$branch" >&2
              failures=$((failures+1))
            fi
          done
          printf 'Old branch histories preserved in main; failed deletions: %s\\n' "$failures"
          if (( failures > 0 )); then exit 1; fi
